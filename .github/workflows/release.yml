name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: TimeLens Internal ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/TimeLens-windows/*
            artifacts/TimeLens-macos/*
