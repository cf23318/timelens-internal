name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Keep each platform's binaries and provenance together
        run: |
          mkdir release-assets
          for platform in windows macos; do
            (cd "artifacts/TimeLens-$platform" && zip -r "../../release-assets/TimeLens-${{ github.ref_name }}-$platform.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          name: TimeLens Internal ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip
