name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      employee_build:
        description: 'Build internally configured employee packages (encrypted artifacts only)'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and receiver checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci
        working-directory: project
      - run: npm run build && npm run verify:no-net && npm run test:upload-status && node --test scripts/test-employee-build.mjs
        working-directory: project
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './upload-server[test]'
      - name: Cloudflare issuer checks (local runtime, no deployment or cloud credentials)
        run: npm ci && npm test && npm run test:runtime && npm run check
        working-directory: cloudflare-issuer
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python -m pytest -q
        working-directory: upload-server
      - name: Package administrator tools (explicit source allowlist)
        run: python tools/package-oss-admin.py
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLens-admin-tools
          path: project/src-tauri/target/distribution/admin/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.name }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.employee_build) }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundle: nsis
          - os: macos-latest
            name: macos
            # Keep .app after creating DMG so version/signature checks inspect the packaged app.
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/src-tauri
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '../upload-server[test]'
      - name: Rust unit tests (synthetic data only)
        env:
          TIMELENS_TEST_PYTHON: python
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features frame-contract-tests --lib
      - name: Import Apple signing certificate
        if: matrix.name == 'macos' && github.event_name != 'pull_request' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "timelens_ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "timelens_ci" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "timelens_ci" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build installer
        env:
          # Public CI artifacts are generic diagnostic builds, never employee credentials.
          TIMELENS_ALLOW_UNCONFIGURED_BUILD: '1'
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          # Empty is treated as a signing identity by Tauri; unset for ad-hoc test builds.
          if [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then unset APPLE_SIGNING_IDENTITY; fi
          npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Record source commit and checksums
        run: node scripts/collect-build.mjs ${{ matrix.name }}
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: TimeLens-${{ matrix.name }}
          path: project/src-tauri/target/distribution/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

  employee:
    name: Employee ${{ matrix.name }} (encrypted)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.employee_build == true }}
    needs: checks
    environment: timelens-employee-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundle: nsis
          - os: macos-latest
            name: macos
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Employee builds intentionally restore/save NO dependency or Rust cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e '../upload-server[test]'
      - name: Rust tests before injecting private preset
        env:
          TIMELENS_TEST_PYTHON: python
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features frame-contract-tests --lib
      - name: Prepare private employee preset
        env:
          ACTIVATION_CONFIG_JSON: ${{ secrets.TIMELENS_ACTIVATION_CONFIG_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          try {
          const raw=process.env.ACTIVATION_CONFIG_JSON;
          const parsed=JSON.parse(raw||'null');
          if(!parsed || !/^[a-f0-9]{64}$/.test(parsed.activationCode||''))throw Error('Missing activation preset');
          console.log('::add-mask::'+parsed.activationCode);
          const file=path.join(process.env.RUNNER_TEMP,'timelens.activation.private.json');
          fs.writeFileSync(file,raw,{flag:'wx',mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,'TIMELENS_ACTIVATION_CONFIG='+file+'\n');
          } catch { console.error('Private activation preset preparation failed; credential details suppressed.'); process.exit(1); }
          NODE
      - name: Build employee installer
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Inspect actual employee packages
        run: node scripts/collect-build.mjs ${{ matrix.name }}
      - name: Encrypt private distribution
        env:
          TIMELENS_BUILD_ENCRYPTION_KEY: ${{ secrets.TIMELENS_BUILD_ENCRYPTION_KEY }}
          PACKAGE_PLATFORM: ${{ matrix.name }}
        run: |
          python - <<'PY'
          import os,pathlib,zipfile
          source=pathlib.Path('src-tauri/target/distribution')/os.environ['PACKAGE_PLATFORM']
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'timelens-employee.zip'
          with zipfile.ZipFile(target,'x',compression=zipfile.ZIP_STORED) as z:
            for p in source.rglob('*'):
              if p.is_symlink():raise RuntimeError('Unexpected distribution symlink')
              if p.is_file():z.write(p,p.relative_to(source))
          PY
          mkdir -p src-tauri/target/employee-encrypted
          node scripts/protect-employee-build.mjs seal "$RUNNER_TEMP/timelens-employee.zip" "src-tauri/target/employee-encrypted/TimeLens-${{ matrix.name }}.tle"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const p='src-tauri/target/employee-encrypted/TimeLens-'+process.env.PACKAGE_PLATFORM+'.tle';
          fs.writeFileSync(p+'.sha256',createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'\n');
          NODE
      - name: Upload encrypted employee package only
        uses: actions/upload-artifact@v4
        with:
          name: TimeLens-employee-${{ matrix.name }}-encrypted
          path: |
            project/src-tauri/target/employee-encrypted/*.tle
            project/src-tauri/target/employee-encrypted/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove private preset and plaintext build outputs
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/timelens.activation.private.json" "$RUNNER_TEMP/timelens-employee.zip"
          rm -rf -- src-tauri/target/release src-tauri/target/distribution
