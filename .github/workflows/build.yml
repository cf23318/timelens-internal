name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and receiver checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci
        working-directory: project
      - run: npm run build && npm run verify:no-net && npm run test:upload-status
        working-directory: project
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './upload-server[test]'
      - name: Cloudflare issuer checks (local runtime, no deployment or cloud credentials)
        run: npm ci && npm test && npm run test:runtime && npm run check
        working-directory: cloudflare-issuer
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python -m pytest -q
        working-directory: upload-server
      - name: Package administrator tools (explicit source allowlist)
        run: python tools/package-oss-admin.py
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLens-admin-tools
          path: project/src-tauri/target/distribution/admin/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundle: nsis
          - os: macos-latest
            name: macos
            # Keep .app after creating DMG so version/signature checks inspect the packaged app.
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/src-tauri
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '../upload-server[test]'
      - name: Rust unit tests (synthetic data only)
        env:
          TIMELENS_TEST_PYTHON: python
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features frame-contract-tests --lib
      - name: Import Apple signing certificate
        if: matrix.name == 'macos' && github.event_name != 'pull_request' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "timelens_ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "timelens_ci" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "timelens_ci" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Stage public employee service configuration (no credentials)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const source='config/employee-registration.json',raw=fs.readFileSync(source,'utf8'),value=JSON.parse(raw);
          if(value.format!=='timelens-cloudflare-registration-v1'||value.activationCode||value.accessKeySecret)throw Error('Expected credential-free registration configuration');
          const file=path.join(process.env.RUNNER_TEMP,'timelens-public-service.json');
          fs.writeFileSync(file,raw,{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,'TIMELENS_ACTIVATION_CONFIG='+file+'\n');
          NODE
      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          # Empty is treated as a signing identity by Tauri; unset for ad-hoc test builds.
          if [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then unset APPLE_SIGNING_IDENTITY; fi
          npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Record source commit and checksums
        env:
          TIMELENS_PUBLIC_EMPLOYEE_BUILD: '1'
        run: node scripts/collect-build.mjs ${{ matrix.name }}
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: TimeLens-${{ matrix.name }}
          path: project/src-tauri/target/distribution/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30
