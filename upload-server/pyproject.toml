[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "timelens-internal-frame-server"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "oss2>=2.19.1,<3", "Pillow>=11,<13"]
[project.scripts]
timelens-oss-grant-web = "timelens_upload.grant_web:main"
timelens-oss-grant = "timelens_upload.oss_grant:main"
timelens-archive = "timelens_upload.cli:main"
timelens-oss-admin = "timelens_upload.direct_admin:main"
timelens-cloud-issuer = "timelens_upload.cloud_issuer_cli:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["timelens_upload*"]
[tool.pytest.ini_options]
pythonpath = ["."]
